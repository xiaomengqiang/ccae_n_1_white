  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Badge 组件样式（占位，待填充 token 映射） */
.ant-badge {
  color: var(--color-text-primary);
}
.ant-badge .ant-badge-count {
  /* 单数字 16×16 正圆（半径=高度一半）；多位数字按内容+padding 撑开成胶囊；
       不设 line-height（antd 默认 20px 偏大会压偏文字），用 flex 垂直居中兜底 */
  box-sizing: border-box;
  min-width: 1rem;
  height: 1rem;
  padding: 0 0.25rem;
  border-radius: 0.5rem;
  align-items: center;
  font-size: var(--font-size-base);
  box-shadow: 0 0 0 1px var(--gray-0);
  background-color: var(--color-error);
  color: var(--color-text-inverse);

/* Segmented 组件样式（占位，待填充 token 映射） */
.ant-segmented {
  border-radius: var(--radius-md);
  padding: 0.125rem;
  background: var(--color-fill);
  width: initial !important;
  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  transition: none;

/* 应用级基础样式 — 页面整体布局骨架(Layer 5) */
/* 大屏等比缩放壳:视口铺满 + 页面灰留白 + 画布居中 */
.app-shell {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #f3f3f3;
}

.dark .app-shell {
  background: var(--surface-container-lowest);
}

/* 设计画布:固定 1920×1080,整体 scale(由 App 的 resize 监听注入),布局恒定 */
.app-root {
  width: 1920px;
  height: 1080px;
  flex: none;
  overflow: hidden;
  transform-origin: center center;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.app-body {
  display: flex;
  flex: 1 1 0;
  min-height: 0;
}

/* 主区域:浅灰 #F0F1F4 底,内容与页面边缘 16px 间距(顶部 24px) */
.app-main {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  gap: 16px;
  padding: 24px 16px 16px;
  background: #f3f3f3;
}

.dark .app-main {
  background: var(--surface-container-lowest);
}

/* 指标卡/时间轴 absolute 到画布后的 flex 占位(卡高 + 下侧 gap) */
.metrics-ph {
  flex-shrink: 0;
  height: 170px;
}

.timeline-ph {
  flex-shrink: 0;
  height: 142px;
}

/* S02:3D 机柜区淡出/淡入(home↔业务视图;iframe 保留 DOM) */
.cabinet-fade {
  display: contents; /* 完全透明包裹:不产生盒、不做定位父级 */
  opacity: 1;
  transition: none;
}

/* 淡出改作用于 .cabinet-area 本体(其 position 已是 relative,视觉下移不改变它作为绝对定位上下文?——cabinet-area 内无画布级 absolute 子元素,标题/时间/工具条在它外面) */

(function () {
  const { useState, useEffect, createContext, useContext } = React;
// Layer 1: 全局状态 — 主题模式 + 业务视图状态机(S02) + 诊断详情路由(S03)
// view: 'home' | 'train' | 'infer';detail: null | 'optical' | 'qwen'
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);
  const [view, setView] = useState("home");
  const [detail, setDetail] = useState(null);
  const [detailFrom, setDetailFrom] = useState("home");
  const [resolved, setResolved] = useState(false); // true = Qwen 授权升级已完成

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const openDetail = (id) => {
    setDetailFrom(view);
    setDetail(id);
  };
  const closeDetail = () => {
    if (resolved) {
      const frame = document.querySelector(".cabinet-area-frame");
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: "resolveCabinet", id: "D-08" }, "*");
        // reset 延迟:等 detail 卸载动画/层恢复后再触发,避免被隐藏态吞掉
        setTimeout(() => {
          if (frame.contentWindow) frame.contentWindow.postMessage({ type: "reset" }, "*");
        }, 400);
      }
    }
    setDetail(null);
  };

  // Esc:详情页优先返回 detailFrom,业务视图返回 home
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Escape") return;
      if (detail) { closeDetail(); return; }
      if (view !== "home") setView("home");
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [detail, view]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
    view,
    setView,
    detail,
    detailFrom,
    openDetail,
    closeDetail,
    resolved,
    markResolved: () => setResolved(true),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

  return Math.sqrt(
    (ra[0] - rb[0]) ** 2 + (ra[1] - rb[1]) ** 2 + (ra[2] - rb[2]) ** 2
  );
}

// getIcon 接口的 size 参数需数字 px。源 size 可能是 rem/px/数字，转 px 后吸附到 icon-plus 标准尺寸。
const API_SIZES = [12, 14, 16, 20, 24, 32, 36, 40, 48, 60];
function toApiSize(size) {
  let n = null;
  if (size != null) {
    const m = String(size).trim().match(/(-?\d+(?:\.\d+)?)\s*(rem|px)?/i);
    if (m) {
      n = Number(m[1]);
      if (m[2] && m[2].toLowerCase() === "rem") n = n * getRootFontSize();
    }
  }
  if (n == null || Number.isNaN(n)) return 16;
  let best = API_SIZES[0], bestDiff = Math.abs(n - best);
  for (const s of API_SIZES) {
    const d = Math.abs(n - s);
    if (d < bestDiff) { bestDiff = d; best = s; }
  }
  return best;
}

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
// 精确命中 → 就近匹配（RGB 欧氏距离最小）→ defaultColorId 兜底
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const target = colorHex.toUpperCase();
    // 1. 精确匹配：某个 color 的 value 列表里直接包含目标色
    const exact = colors.find((c) =>
      String(c.value).split(",").map((v) => v.trim().toUpperCase()).includes(target)
    );
    if (exact) return exact.id;
    // 2. 就近匹配：取与目标色 RGB 距离最小的 color（多色值取其中最近的）
    let best = null;
    let bestDist = Infinity;
    for (const c of colors) {
      for (const v of String(c.value).split(",")) {
        const d = colorDistance(target, v.trim());
        if (d < bestDist) { bestDist = d; best = c; }
      }
    }
    if (best) return best.id;
  }
  // 3. 兜底：线性通用色 → 该 style 下第一个 → 空串
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (结果缓存在 iconInfoMap；并发去重靠 iconInfoPromiseMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  // 同 name 并发请求共享同一个进行中 Promise，避免 N 个相同图标各发一次 getIconInfo
  if (iconInfoPromiseMap[name]) return iconInfoPromiseMap[name];
  const p = (async () => {
    try {
      const resp = await fetch(
        `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
      );
      const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
      const entry = (Array.isArray(data) ? data : [data]).find(
        (d) => d.icons?.length
      );
      const selected = selectBestIcon(entry?.icons || [], name);
      if (!selected?.url) return null;
      iconInfoMap[name] = { name: selected.name, url: selected.url };
      return iconInfoMap[name];
    } catch (e) {
      return null;
    }
  })();
  iconInfoPromiseMap[name] = p;
  // 落定后清除 in-flight 条目（失败也清除，允许下次重试，不永久缓存 rejected 结果）
  p.finally(() => {
    delete iconInfoPromiseMap[name];
  });
  return p;
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
// 结果缓存在 svgCache；并发去重靠 svgPromiseMap，相同 key 共享同一进行中 Promise
// key 含 size：不同尺寸取回的 SVG 不同，不可复用
function fetchSvg(name, variant, colorHex, size) {
  const key = `${name}&${variant}&${colorHex}&${size}`;
  if (svgCache.has(key)) return Promise.resolve(svgCache.get(key));
  if (svgPromiseMap.has(key)) return svgPromiseMap.get(key);
  const p = (async () => {
    const info = await resolveIconInfo(name);
    if (!info) return "";
    const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
    const colorId = resolveColorId(variant, colorHex);
    try {
      const resp = await fetch(
        `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=${toApiSize(size)}&style=${encodeURIComponent(
          styleValue
        )}&color=${encodeURIComponent(colorId)}&fileType=svg`
      );
      const data = await resp.json(); // { url, name, data } or array
      const item = Array.isArray(data) ? data[0] : data;
      return item?.data || ""; // raw SVG text, injected as-is
    } catch (e) {
      return "";
    }
  })();
  svgPromiseMap.set(key, p);
  // 落定后写入结果缓存并清除 in-flight 条目；空结果（失败）不缓存，允许下次重试
  p.then((s) => {
    if (s) svgCache.set(key, s);
  }).finally(() => {
    svgPromiseMap.delete(key);
  });
  return p;
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rootFontSize = getRootFontSize();
    const rem = size / rootFontSize;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
  onClick,
  title,
  id,
}) {
  const resolvedSize = resolveSize(size);
  const mergedStyle = onClick ? { cursor: "pointer", ...style } : style;
  const wrapRef = useRef(null);
  const [inheritedColor, setInheritedColor] = useState(null);
  const effectiveColor = color || inheritedColor;
  const [plus, setPlus] = useState(plusState); // reuse already-probed result

    // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才需要继承父元素颜色；
  // Lucide / img 模式颜色由 CSS（currentColor）或属性直接处理，不读计算色、不监听主题
  useLayoutEffect(function () {
    if (src || plus !== true || color) return;
    const el = wrapRef.current;
    if (!el) return; // 尚未挂载（首次 plus===null 返回 null）
    const hex = rgbToHex(getComputedStyle(el).color);
    if (hex && hex !== inheritedColor) setInheritedColor(hex);
  });

  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-flex", alignItems: "center", justifyContent: "center", verticalAlign: "middle", lineHeight: 0, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, display: "inline-flex", alignItems: "center", justifyContent: "center", verticalAlign: "middle", lineHeight: 0, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

/* ===== src/utils/time-scale.js ===== */
(function () {
// 时间轴刻度换算工具：将 "HH:MM:SS" 时间转换为区间内的百分比位置

function timeToMinutes(time) {
  const [h, m, s] = time.split(":").map(Number);
  return h * 60 + m + s / 60;
}

/**
 * 计算 time 在 [start, end] 区间内的位置比例（0 ~ 1）
 * @param {string} time "HH:MM:SS"
 * @param {{start: string, end: string}} range
 * @returns {number} 0 ~ 1
 */
function fractionOf(time, range) {
  const start = timeToMinutes(range.start);
  const end = timeToMinutes(range.end);
  const current = timeToMinutes(time);
  return (current - start) / (end - start);
}

/**
 * 生成 [start, end] 内每分钟一个的时刻列表
 * @param {{start: string, end: string}} range
 * @returns {string[]} "HH:MM:SS" 数组
 */
function minuteTicks(range) {
  const start = timeToMinutes(range.start);
  const end = timeToMinutes(range.end);
  const ticks = [];
  for (let t = Math.ceil(start); t <= Math.floor(end); t++) {
    const h = Math.floor(t / 60);
    const m = t % 60;
    ticks.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:00`);
  }
  return ticks;
}
  Object.assign(__export, { timeToMinutes, fractionOf, minuteTicks });
})();

// —— 主区业务视图(浏览导航 + 卡片列表;home 时整体隐藏) ——
function WorkloadBrowser({ filterKey }) {
  const { view, detail, openDetail } = useApp();
  const [sortKey, setSortKey] = useState("status");
  const [sortOpen, setSortOpen] = useState(false);

  // ④ 视图或过滤变化时关闭排序下拉
  useEffect(() => {
    setSortOpen(false);
  }, [view, filterKey]);
  const [selectedCard, setSelectedCard] = useState(null);
  const [glassTarget, setGlassTarget] = useState(null);
  const [glass, setGlass] = useState({ first: -1, last: -1, count: 0 });
  const listRef = useRef(null);

  const items = useMemo(() => {
    const src = view === "train" ? TRAIN_JOBS : INFER_SERVICES;
    let arr = [...src];
    if (filterKey && filterKey !== "total") {
      arr = arr.filter((it) => {
        if (filterKey === "normal") return it.status === "normal";
        if (filterKey === "degrade") return it.status === "degrade";
        if (filterKey === "interrupt") return it.status === "interrupt";
        if (filterKey === "stall") return it.status === "stall";
        return true;
      });
    }
    if (sortKey === "status") {
      const order = { interrupt: 0, degrade: 1, stall: 2, normal: 3 };
      arr.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
    } else if (sortKey === "name") {
      arr.sort((a, b) => a.name.localeCompare(b.name, "zh"));
    } else if (sortKey === "npu") {
      arr.sort((a, b) => b.npuCards - a.npuCards);
    }
    return arr;
  }, [view, filterKey, sortKey]);

  // 滚动时更新玻璃框与短条明暗(节流 rAF)
  useEffect(() => {
    const list = listRef.current;
    if (!list) return undefined;
    let raf = 0;
    const update = () => {
      raf = 0;
      const els = Array.from(list.querySelectorAll(".wl-cell"));
      const listTop = list.scrollTop;
      const listBottom = listTop + list.clientHeight - 64; // 渐隐区不算可视
      let first = -1, last = -1;
      els.forEach((el, i) => {
        const t = el.offsetTop, b = t + el.offsetHeight;
        if (b > listTop + 8 && t < listBottom) { if (first < 0) first = i; last = i; }
        // 短条明暗由 glass state 渲染驱动(见 wl-bars map)
      });
      if (els.length === 0) { setGlass({ first: -1, last: -1, count: 0 }); return; }
      if (first >= 0 && last >= 0) setGlass({ first, last, count: els.length });
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
    list.addEventListener("scroll", onScroll, { passive: true });
    update();
    return () => { list.removeEventListener("scroll", onScroll); if (raf) cancelAnimationFrame(raf); };
  }, [items]);



  const active = (view === "train" || view === "infer") && !detail;
  const businessName = view === "train" ? "训练作业" : "推理服务";
  const filterName =
    filterKey === "interrupt" ? "中断" : filterKey === "degrade" ? "劣化" : filterKey === "stall" ? "卡死" : filterKey === "normal" ? "正常运行" : null;

  const scrollBy = (dir) => {
    if (listRef.current) listRef.current.scrollBy({ top: dir * 544, behavior: "smooth" });
  };

  if (!active) return null;

  return (
    <div className="wl-root">
      {/* 浏览导航 */}
      <div className="wl-nav">
        <button
          type="button"
          className="wl-sort"
          onClick={() => setSortOpen((v) => !v)}
          title="排序"
        >
          <span>{{ status: "按状态排序", name: "按名称", npu: "按 NPU 卡数" }[sortKey]}</span>
          <span className="wl-sort-caret" aria-hidden="true">⌄</span>
        </button>
        {sortOpen ? (
          <div className="wl-sort-menu">
            {[["status", "按状态排序（异常在前）"], ["name", "按名称"], ["npu", "按 NPU 卡数"]].map(([k, label]) => (
              <button
                key={k}
                type="button"
                className={`wl-sort-item${sortKey === k ? " wl-sort-item-on" : ""}`}
                onClick={() => { setSortKey(k); setSortOpen(false); }}
              >
                {label}
              </button>
            ))}
          </div>
        ) : null}
        <span className="wl-nav-sep" />
        <div className="wl-bars-wrap">
        <div className="wl-bars">
          {items.map((it, i) => (
            <span
              key={it.key}
              data-bar={it.key}
              className={`wl-bar${i >= glass.first && i <= glass.last ? " wl-bar-visible" : ""}`}
              style={{ background: STATUS_COLOR[it.status] || STATUS_COLOR.normal }}
              title={it.name}
              onClick={() => {
                // 只滚列表容器(相对 offset 累加),绝不动页面滚动
                const list = listRef.current;
                const el = list?.querySelector(`[data-key="${it.key}"]`);
                if (list && el) {
                  let top = 0;
                  let node = el;
                  while (node && node !== list) { top += node.offsetTop; node = node.offsetParent; }
                  list.scrollTo({ top: Math.max(0, top - list.clientHeight / 2 + 124), behavior: "smooth" });
                  setSelectedCard(it.key);
                  setGlassTarget({ top: Math.max(0, top - list.clientHeight / 2 + 124), key: it.key });
                }
              }}
            />
          ))}
        </div>
        {glass.count > 0 ? (
          <span
            className="wl-glass"
            style={{
              left: `calc(3px + (100% - 6px) * ${glass.first / glass.count})`,
              width: `calc((100% - 6px) * ${(glass.last - glass.first + 1) / glass.count})`,
            }}
            aria-hidden="true"
          />
        ) : null}
        </div>

        <div className="wl-page-btns">
          <button type="button" className="wl-page-btn" title="上一组" onClick={() => scrollBy(-1)}>‹</button>
          <button type="button" className="wl-page-btn" title="下一组" onClick={() => scrollBy(1)}>›</button>
        </div>
      </div>

      {/* 卡片列表 */}
      <div className="wl-list-mask">
        <div className="wl-list" ref={listRef}>
          {items.length === 0 ? (
            <div className="wl-empty">
              <img src={`${S02}/icon-cube.svg`} alt="" className="wl-empty-icon" draggable={false} />
              <span>暂无{filterName || "该状态"}的{businessName}</span>
            </div>
          ) : (
            <div className="wl-grid">
              {items.map((it) => (
                <div data-key={it.key} key={it.key} className="wl-cell">
                  <WlCard
                    item={it}
                    view={view}
                    selected={selectedCard === it.key}
                    onClick={() => {
                      setSelectedCard(selectedCard === it.key ? null : it.key);
                      if (it.key === "svc-qwen15") openDetail("qwen");
                    }}
                  />
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
  Object.assign(__export, { WorkloadBrowser });
})();

(function () {
  const { useEffect, useRef, useState } = React;
  const { useApp, Icon } = __export;
const S03 = "./assets/uploads/s03";

const STATUS_TAG = {
  done: { text: "已完成", bg: "#E7FBF2", color: "#09AA71" },
  manual: { text: "待人工处理", bg: "#FEE7E8", color: "#E02128" },
  none: { text: "无可用方案", bg: "#FEE7E8", color: "#E02128" },
};

// 单个步骤(手风琴行)
function Step({
  step, open, onToggle, children, chartData, last, dataStep, onResolved,
}) {
  const tag = STATUS_TAG[step.status];
  // 图标仅 manual 用圆环,其余(done/none)一律绿勾
  return (
    <div className="st-step" data-step={dataStep}>
      <button type="button" className={`st-head${open ? " st-head-open" : ""}`} onClick={onToggle}>
        <span className={`st-icon${step.status === "manual" ? " st-icon-spin" : ""}`}>
          <img src={`${S03}/${step.status === "manual" ? "ic-step-monitor" : "ic-step-done"}.svg`} alt="" draggable={false} />
        </span>
        <span className="st-name">{step.name}</span>
        <span className="st-tag" style={{ background: tag.bg, color: tag.color }}>{tag.text}</span>
        <img className="st-caret" src={`${S03}/${open ? "ic-chevron-up" : "ic-chevron-down"}.svg`} alt="" draggable={false} />
      </button>
      {!last ? <span className="st-line" aria-hidden="true" /> : null}
      <div className={`st-body${open ? " st-body-open" : ""}`}>
        <div className="st-body-inner">
          {children}
        </div>
      </div>
    </div>
  );
}

// 处理过程手风琴(默认最后一个当前步骤展开)
function StepList({ steps, chartData, jumpKey, listRef, onResolved }) {
  const [openKeys, setOpenKeys] = useState(() => {
    const cur = steps.filter((s) => s.status === "manual").map((s) => s.key);
    return new Set(cur.length ? cur : [steps[steps.length - 1].key]);
  });
  const rootRef = listRef || useRef(null);

  // 右侧处理环节节点 → 展开并滚动到该步骤
  useEffect(() => {
    if (!jumpKey) return;
    setOpenKeys((prev) => new Set(prev).add(jumpKey));
    const el = rootRef.current?.querySelector(`[data-step="${jumpKey}"]`);
    if (el && rootRef.current) {
      let top = 0, node = el;
      while (node && node !== rootRef.current) { top += node.offsetTop; node = node.offsetParent; }
      rootRef.current.scrollTo({ top, behavior: "smooth" });
    }
  }, [jumpKey]);
  const allOpen = openKeys.size >= steps.length;

  const toggle = (key) => {
    setOpenKeys((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };
  const toggleAll = () => {
    setOpenKeys(allOpen ? new Set() : new Set(steps.map((s) => s.key)));
  };

  const lastKey = steps[steps.length - 1].key;

  return (
    <div className="st-list" ref={rootRef}>
      <div className="st-title-row">
        <span className="st-title">处理过程</span>
        <button type="button" className="st-expand-all" onClick={toggleAll}>
          <img src={`${S03}/ic-expand-all.svg`} alt="" draggable={false} />
          {allOpen ? "收起全部" : "展开全部"}
        </button>
      </div>

      {steps.map((step, idx) => (
        <Step
          key={step.key}
          dataStep={step.key}
          onResolved={onResolved}
          step={step}
          last={idx === steps.length - 1}
          open={openKeys.has(step.key)}
          onToggle={() => toggle(step.key)}
          chartData={chartData}
        >
          {step.record ? (
            <p className="st-record">
              <span className="st-record-time">{step.record.time}</span>
              <span className="st-record-title">{step.record.title}</span>
            </p>
          ) : null}
          {step.body ? <p className="st-text">{step.body}</p> : null}

          {step.recover ? (
            <div className="st-opt-recover">
              {/* 恢复主体图(自带 28 缩进) */}
              <img
                className="st-recover-img"
                src={`${S03}/opt-recover-body@2x.png`}
                alt=""
                draggable={false}
              />
              <ChartBlock chart={chartData.POWER_CHART} svg="chart-power" height={208} />
              <ChartBlock chart={chartData.ERRORS_CHART} svg="chart-errors" height={160} />
            </div>
          ) : null}

          {step.qwenRecover ? <QwenRecover onResolved={onResolved} /> : null}
        </Step>
      ))}
    </div>
  );
}

// 图表块(svg + DOM 绝对文字)
function ChartBlock({ chart, svg, height }) {
  const [hover, setHover] = useState(null);
  return (
    <div
      className="st-chart"
      style={{ height }}
      onMouseMove={(e) => {
        const r = e.currentTarget.getBoundingClientRect();
        setHover(((e.clientX - r.left) / r.width) * 424);
      }}
      onMouseLeave={() => setHover(null)}
    >
      <img src={`${S03}/${svg}.svg`} alt="" draggable={false} />
      <span className="st-chart-title">{chart.title}</span>
      {chart.yTicks.map((t) => (
        <span key={t.text} className="st-chart-tick" style={{ left: t.x, top: t.y }}>{t.text}</span>
      ))}
      {chart.threshold ? (
        <span className="st-chart-tick st-chart-threshold" style={{ left: chart.threshold.x, top: chart.threshold.y }}>
          {chart.threshold.text}
        </span>
      ) : null}
      {chart.xTicks.map((t) => (
        <span key={t.text} className="st-chart-tick st-chart-x" style={{ left: t.x, top: chart.xTickY }}>{t.text}</span>
      ))}
      {chart.legend ? chart.legend.items.map((it) => (
        <span key={it.label} className="st-chart-legend" style={{ left: it.x, top: chart.legend.textY }}>
          <i style={{ background: it.color, left: it.dotX - it.x, top: chart.legend.y - chart.legend.textY }} />
          {it.label}
        </span>
      )) : null}
      {hover !== null ? (
        <>
          <span className="st-chart-cursor" style={{ left: hover }} />
          <span className="st-chart-tip" style={{ left: Math.min(hover + 8, 300) }}>
            12:0{Math.floor(hover / 53)}:40 · 通道1 −1.2 · 通道2 −1.0 · 通道3 −0.9 · 通道4 −3.2 dBm
          </span>
        </>
      ) : null}
    </div>
  );
}

// §6 授权升级完整流程组件(确认弹窗 → 升级中 → 完成态)
function QwenRecover({ onResolved }) {
  const { resolved } = useApp();
  const [phase, setPhase] = useState("idle"); // idle | confirm | upgrading | done
  const [progress, setProgress] = useState(0);
  const [extraRecords, setExtraRecords] = useState([]);
  const timers = useRef([]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const startUpgrade = () => {
    setPhase("upgrading");
    setProgress(0);
    const t0 = performance.now();
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / 3000);
      setProgress(p);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    const REC = [
      "12:06:20 开始升级 hinic3 驱动",
      "12:06:48 驱动升级完成，版本 V13.1",
      "12:06:52 D-08 实例已恢复，Qwen-1.5B 请求成功率 99.95%",
    ];
    timers.current = [
      setTimeout(() => setExtraRecords((r) => [...r, REC[0]]), 1000),
      setTimeout(() => setExtraRecords((r) => [...r, REC[1]]), 2000),
      setTimeout(() => {
        setExtraRecords((r) => [...r, REC[2]]);
        setPhase("done");
        if (onResolved) onResolved();
        window.dispatchEvent(new CustomEvent("s03:toast", { detail: { text: "网卡驱动升级完成，业务已恢复" } }));
      }, 3000),
    ];
  };

  const done = phase === "done" || resolved;

  return (
    <div className="st-qwen-recover">
      <p className="st-record">
        <img className="st-record-dot" src={`${S03}/ic-record-dot.svg`} alt="" draggable={false} />
        <span className="st-text-inline">
          12:06:06 待人工确认执行网卡升级，升级后核查驱动版本、D-08 实例和 Qwen-1.5B 服务
        </span>
      </p>
      {extraRecords.map((r) => (
        <p key={r} className="st-record">
          <img className="st-record-dot" src={`${S03}/ic-record-dot.svg`} alt="" draggable={false} />
          <span className="st-text-inline">{r}</span>
        </p>
      ))}
      <div className={`st-version-card${phase === "upgrading" ? " st-version-upgrading" : ""}`}>
        <div className="st-vc-head">
          <span className="st-vc-name">hinic3 网卡驱动</span>
          <span className="st-vc-host">112.34.23.1 · CPU02</span>
        </div>
        <div className="st-vc-body">
          <div className="st-vc-cell">
            <span className="st-vc-label">{done ? "已升级版本" : "当前版本"}</span>
            <span className="st-vc-ver">{done ? "V13.1" : "V11.8"}</span>
          </div>
          <span className="st-vc-swap" aria-hidden="true">
            <img src={`${S03}/ic-version-ring.svg`} alt="" className="st-vc-ring" draggable={false} />
            <img src={`${S03}/ic-version-swap.svg`} alt="" className="st-vc-arrow" draggable={false} />
          </span>
          <div className="st-vc-cell st-vc-target">
            <span className="st-vc-label">{done ? "当前版本" : "待升级版本"}</span>
            <span className="st-vc-ver st-vc-ver-grad">V13.1</span>
          </div>
        </div>
        {phase === "upgrading" ? <div className="st-progress"><span style={{ width: `${progress * 100}%` }} /></div> : null}
        <div className="st-vc-foot">
          {done ? (
            <button type="button" className="st-auth-btn st-auth-done" disabled>已升级</button>
          ) : phase === "upgrading" ? (
            <button type="button" className="st-auth-btn st-auth-busy" disabled>
              <span className="st-spinner" aria-hidden="true" />升级中…
            </button>
          ) : (
            <button type="button" className="st-auth-btn" onClick={() => setPhase("confirm")}>授权升级网卡</button>
          )}
        </div>
      </div>

      {phase === "confirm" ? (
        <div className="st-confirm-mask" onClick={() => setPhase("idle")}>
          <div className="st-confirm" onClick={(e) => e.stopPropagation()}>
            <span className="st-confirm-title">确认授权升级</span>
            <p className="st-confirm-body">
              将在 112.34.23.1 · CPU02 上把 hinic3 网卡驱动从 V11.8 升级至 V13.1，期间 D-08 实例将短暂不可用（约 30 秒）。

            <div className="st-confirm-btns">

            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}
  Object.assign(__export, { StepList });

  const [jumpKey, setJumpKey] = useState(null);
  const scrollRef = useRef(null); // 右侧处理环节节点 → 左侧步骤

  useEffect(() => {
    const onJump = (e) => setJumpKey(e.detail ? e.detail.key : null);
    window.addEventListener("s03:jump-step", onJump);
    return () => window.removeEventListener("s03:jump-step", onJump);
  }, []);

  if (!detail) return null;

  const isOptical = detail === "optical";
  // qwen 已恢复:故障恢复步骤 → 已完成
  const steps = isOptical
    ? OPTICAL_STEPS
    : resolved
      ? QWEN_STEPS.map((st) => (st.key === "q-recover" ? { ...st, status: "done" } : st))
      : QWEN_STEPS;
  const assetKey = isOptical ? "opt" : "qw";

  return (
    <>
      {/* 左侧面板(x48–532):替换算小维(由 app 层互斥渲染) */}
      <aside className={`dt-panel${expandedPanel ? " dt-panel-hidden" : ""}`}>
        {/* 页头图(含返回箭头/标题/标签/时间/···) */}
        <img
          className="dt-header"
          src={`${S03}/${assetKey}-header@2x.png`}
          alt=""
          draggable={false}
        />
        {/* 返回热区 */}
        <button
          type="button"
          className="dt-back-hot"
          title="返回"
          onClick={closeDetail}
        />
        {/* 已恢复标签(授权升级完成,覆盖页头待人工处理) */}
        {resolved && !isOptical ? <span className="dt-restored-tag">已恢复</span> : null}
        {/* 更多热区(菜单第2批) */}
        <button type="button" className="dt-more-hot" title="更多" />

        <span className="dt-head-divider" aria-hidden="true" />

        {/* 滚动区:摘要卡 + 处理过程 */}
        <div className="dt-scroll" ref={scrollRef}>
          <img
            className="dt-summary"
            src={`${S03}/${assetKey}-summary@2x.png`}
            alt=""
            draggable={false}
          />
          <StepList steps={steps} chartData={{ POWER_CHART, ERRORS_CHART }} jumpKey={jumpKey} listRef={scrollRef} onResolved={markResolved} />
        </div>

        {/* 底部固定输入区(复用首页输入框样式) */}
        <div className="dt-input-zone">
          <img className="dt-input-bg" src="./assets/uploads/s01/input-box@2x.png" alt="" draggable={false} />
          <input className="dt-input" placeholder="输入问题或输入“/”触发提示词" aria-label="输入问题" />
        </div>
      </aside>

      {/* 右侧诊断区内容(§4/§5) */}
      <DetailRight expanded={expandedPanel} onExpandToggle={() => setExpandedPanel((v) => !v)} />

      {/* 工具条(覆盖在最上) */}
      <section className={`dt-right dt-right-toolbar-only${expandedPanel ? " dt-right-expanded" : ""}`}>
        <div className="dt-toolbar">
          <span className="dt-toolbar-title">诊断详情</span>
          <button
            type="button"
            className="dt-toolbar-zoom"
            title={expandedPanel ? "收起" : "放大"}
            onClick={() => setExpandedPanel((v) => !v)}
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#777" strokeWidth="1.8" strokeLinecap="round" aria-hidden="true">
              {expandedPanel ? (
                <>
                  <path d="M9 3H3v6" /><path d="M15 21h6v-6" />
                  <path d="M3 3l7 7" /><path d="M21 21l-7-7" />
                </>
              ) : (
                <>
                  <path d="M3 9V3h6" /><path d="M21 15v6h-6" />
                  <path d="M3 9l7-7" /><path d="M21 15l-7 7" />
                </>
              )}
            </svg>
          </button>
        </div>
      </section>
      {toast ? <span className="dt-toast">{toast}</span> : null}
    </>
  );
}
  Object.assign(__export, { DetailPanel });
})();

/* ===== app.jsx ===== */
(function () {
  const { useEffect, useRef, useState } = React;
  const { ConfigProvider, Empty } = antd;
  const { AppProvider, useApp } = __export;
  const zhCN = __export.zhCN;
  const TopNav = __export.TopNav;
  const SideNav = __export.SideNav;
  const AiPanel = __export.AiPanel;
  const MetricsArea = __export.MetricsArea;
  const CabinetArea = __export.CabinetArea;
  const TimelineArea = __export.TimelineArea;
  const WorkloadBrowser = __export.WorkloadBrowser;
  const DetailPanel = __export.DetailPanel;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (per-domain files, e.g. device.js / alarm.js)
//   Layer 3 reusable      → src/components/{name}/ (cross-view, e.g. status-tag / section-card)
//   Layer 4 views         → src/views/{name}/      (one per tab/section, e.g. device-table / header-bar)
//   src/utils/            → pure function utilities (formatNumber, debounce, etc.)
//   src/hooks/            → custom React hooks (useDebounce, useTableData, etc.)
//   src/constants/        → enums and config constants (STATUS_MAP, PAGE_SIZE, etc.)
//   src/styles/           → cross-view shared CSS (utility classes, keyframes; not antd overrides)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.















// 大屏等比缩放:设计画布固定 1920×1080,按视口整体 scale 并居中,
// 任何窗口尺寸下布局比例与 1920×1080 完全一致;留白用页面灰填充。
// transform: scale 不改变布局尺寸,iframe(3D)内部 viewport 不受影响。
const DESIGN_W = 1920;
const DESIGN_H = 1080;

// 内层页面(可使用 useApp;3D 区按视图切换隐藏态)
function Page({ metricFilter, rootRef }) {
  const { view, detail } = useApp();

  // ④ 切换视图时重置过滤为「总数」
  useEffect(() => {
    metricFilter[1]("total");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [view]);
  return (
    <div className="app-shell">
      <div className="app-root" ref={rootRef}>
        <TopNav />
        <div className="app-body">
          <SideNav />
          {detail ? <DetailPanel /> : <AiPanel />}
          <div className="app-main">
            <MetricsArea onFilterChange={metricFilter[1]} />
            {/* 指标卡已 absolute 到画布 (554,72),此处占位保持 flex 流高度 */}
            <div className="metrics-ph" aria-hidden="true" />
            {/* 3D 机柜区:业务视图下淡出下移(iframe 保留 DOM 不卸载,回 home 不重载) */}
            <div className={`cabinet-fade${view === "home" && !detail ? "" : " cabinet-fade-hidden"}`}>
              <CabinetArea />
            </div>
            <TimelineArea />
            {/* 时间轴已 absolute 到画布 (556,929),此处占位保持 flex 流高度 */}
            <div className="timeline-ph" aria-hidden="true" />
            <WorkloadBrowser filterKey={metricFilter[0]} />
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const rootRef = useRef(null);
  const [metricFilter, setMetricFilter] = useState("total");

  useEffect(() => {
    const fit = () => {
      const el = rootRef.current;
      if (!el) return;
      const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
      el.style.transform = `scale(${scale})`;
    };
    fit();
    window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  }, []);

  return (
    <AppProvider>
      <ConfigProvider
        locale={zhCN}
        wave={{ disabled: true }}
        renderEmpty={() => <Empty style={{ padding: "2rem 0" }} />}
        empty={{ image: "./assets/uploads/empty.svg" }}
        spin={{ indicator: <img src="./assets/uploads/loading.svg" alt="" className="custom-spin-indicator" /> }}
      >
        <Page metricFilter={[metricFilter, setMetricFilter]} rootRef={rootRef} />
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
